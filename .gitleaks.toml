[extend]
# Use the default gitleaks rules as a base.
useDefault = true

[allowlist]
# Paths to exclude from scanning.
paths = [
  # Zig pins dependencies by multihash. Those literals look enough like
  # high-entropy credentials to trip the generic rules, and they are
  # deliberately public.
  '''build\.zig\.zon''',

  # CMake and Zig build outputs, including fetched third-party SDKs.
  '''^build/''',
  '''^zig-out/''',
  '''^zig-pkg/''',
]
