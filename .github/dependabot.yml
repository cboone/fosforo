# Dependabot keeps two surfaces current, and neither is the plugin itself.
#
# 1. github-actions: every external `uses:` reference. These are SHA-pinned with
#    a trailing `# vX.Y.Z` comment, and Dependabot updates the SHA and the
#    comment together. `directories` is what reaches the composite actions:
#    a bare `directory: /` scans .github/workflows/ only, which would leave the
#    two `actions/cache` pins in .github/actions/clap-validator/action.yml
#    unwatched.
# 2. npm: the two Markdown tools in package.json, pinned exactly.
#    `versioning-strategy: increase` bumps those exact pins rather than
#    widening them to a caret range, which is what keeps #122's guard
#    meaningful: a linter pin should only ever move in a diff that says so.
#
# Dependabot does NOT track anything Zig. `build.zig.zon` pins Zig 0.16.0, CLAP
# and zig-objc by content hash, and there is no Dependabot ecosystem for it, so
# those stay deliberate scheduled work under ADR 0002. It also cannot see the
# pinned tool versions inside workflow `env:` blocks, or the SHA-256 checksums
# the shell scripts carry; `upgrade-everything` is what sweeps those.
#
# Weekly rather than daily, because every action gets its own pull request and
# this repository has one maintainer. Minor and patch land grouped; majors open
# individually so a breaking change stays visible.

version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/clap-validator"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - "*"
        update-types:
          - major
