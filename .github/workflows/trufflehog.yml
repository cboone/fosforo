name: trufflehog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Named for the tool rather than `scan`; see gitleaks.yml for the reason
  # and the measurement behind it.
  trufflehog:
    uses: cboone/gh-actions/.github/workflows/scan-for-secrets.yml@844bf31d4ec26df9d0aa531e79d8c3fccf9f0638 # v3.1.0
    with:
      tool: trufflehog
      # 53s max over 28 runs. An input rather than a job key, because the job
      # belongs to the reusable workflow, whose own default is 15. The
      # `Validate inputs` job there sets no timeout at all and so inherits
      # GitHub's 360; that is not reachable from here.
      timeout-minutes: 3
