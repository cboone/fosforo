name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".claude/**"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".claude/**"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Workflow-level rather than job-level because two jobs now validate a .clap and
# share one cache entry. Duplicating these would let the two cache keys drift, and a
# drifted key still passes; it just quietly pays a full Rust build every run.
#
# Both pins are deliberate. clap-validator is not on crates.io, so it is built from
# git, where a commit is the only reference upstream cannot move; `--locked` extends
# that to its dependency tree. Pinning Rust as well keeps a future stable release
# that cannot build this commit from turning CI red with no change on this side.
# Bump them together and the cache key follows. Neither pin costs anything on a hit.
env:
  # Tag 0.4.1, resolved to its commit: tags can move, commits cannot.
  VALIDATOR_REV: 152b9823e992d782c5c1fd33bca0295478b919aa
  # clap-validator 0.4.1 declares MSRV 1.95.0 and is edition 2024, which the runner
  # image's preinstalled Rust may or may not satisfy from one refresh to the next.
  # This is the toolchain the local install was built with.
  RUST_VERSION: "1.97.1"

jobs:
  # Must run on macOS: the plugin links Cocoa, Metal, QuartzCore and CoreVideo,
  # so it cannot build or test on the default ubuntu-latest runner.
  # Cross-compilation is off for the same reason (see ADR 0001).
  ci:
    uses: cboone/gh-actions/.github/workflows/run-zig-ci.yml@91f9abd25d4f82354c0f950dfc8b6d7525b0f5b5 # v3.0.0
    with:
      zig-version-file: build.zig.zon
      runs-on: macos-latest
      run-cross-compile: false

  # Shaders compile at runtime from embedded source, so the build deliberately
  # does not depend on the Metal toolchain (ADR 0009). This job installs it
  # solely to type-check them, which is why it is separate from `ci` above.
  shaders:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for the Metal toolchain
        id: metal
        run: |
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Metal toolchain absent from this runner image; downloading it."
          fi

      - name: Download the Metal toolchain
        if: steps.metal.outputs.available == 'false'
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun --kill-cache

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version-file: build.zig.zon

      - name: Type-check shaders
        run: zig build validate-shaders

  # The reusable workflow's `format` job runs `zig fmt --check` and nothing
  # else, so no shell tooling ran anywhere in this repository. That left the
  # `.editorconfig` profile resting on someone remembering to run the tool.
  #
  # Ubuntu rather than macOS: both tools are platform-independent static
  # analysis, and the macOS runner bills at ten times the rate.
  #
  # Both versions are pinned for the same reason the validator below is. The
  # runner image ships shellcheck 0.9.0, which would move under this on the next
  # image refresh; these are the versions the profile was verified against.
  # Release binaries rather than a setup action adds no third-party action to
  # audit, but a version in a URL is not a pin: a release asset can be replaced
  # in place under the same tag. The SHA256 sums below are the pin, and the job
  # refuses to install anything that does not match. Bump a version and its sum
  # together; `shasum -a 256` on the downloaded asset produces the replacement.
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHFMT_VERSION: "3.13.1"
      SHFMT_SHA256: "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1"
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Neither project publishes a checksum manifest with its releases, so the
      # sums are committed here rather than fetched. Fetching them from the same
      # host that serves the asset would verify transport, not provenance.
      #
      # shellcheck is downloaded to a file rather than piped straight into tar,
      # because a pipe would have tar consuming bytes before anything could
      # verify them.
      - name: Install shfmt and shellcheck
        run: |
          curl -sSfL -o shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  shfmt" | sha256sum --check --strict -
          sudo install shfmt /usr/local/bin/shfmt

          curl -sSfL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum --check --strict -
          tar -xJf shellcheck.tar.xz
          sudo install "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      # Confirms the pins resolved to the intended versions, so a sum bumped
      # without its version (or the reverse) fails here rather than silently
      # linting with a different tool than the profile was verified against.
      - name: Report tool versions
        run: |
          shfmt --version
          shellcheck --version | sed -n 's/^version: /shellcheck /p'

      # No parser or printer options, deliberately. shfmt discards .editorconfig
      # wholesale if any of them is passed (-ln, -p, -s, -i, -bn, -ci, -sr, -kp,
      # -fn, -mn), and that file is the only place the profile is recorded. The
      # output-mode selectors are unaffected, which is why -d, -f and -w are all
      # safe to use here.
      #
      # `git ls-files` rather than `shfmt -d .`, so the set of files is exactly
      # what the repository tracks. shfmt does not read .gitignore, and walking
      # the tree reaches vendored shell scripts under build/ once anyone has run
      # the CMake build: five of them ship with the AudioUnit SDK and clap-wrapper
      # and are not this project's to format. A fresh CI checkout has no build/,
      # so `-d .` would pass here and fail locally, which is the exact
      # local-versus-CI divergence this job exists to prevent. `shfmt -f` then
      # filters to shell files by shebang, so nothing hardcodes a path.
      - name: Check shell formatting
        run: git ls-files -z | xargs -0 shfmt -f | xargs -r shfmt -d

      - name: Lint shell scripts
        run: git ls-files -z | xargs -0 shfmt -f | xargs -r shellcheck

  # ADR 0003, AGENTS.md, and the plan's verification table all name
  # `clap-validator` as required verification, but nothing ran it except someone
  # remembering to. The failures it catches are quiet: a descriptor field going
  # null, a lifecycle callback losing `callconv(.c)`, or a duplicate entry in the
  # feature list all compile, pass `zig build test`, and surface only here or
  # inside someone's DAW.
  #
  # Only failures and crashes fail the job. clap-validator exits non-zero on
  # `num_failed`, which counts `Failed` and `Crashed` but not `Warning`, so a
  # warning appears in the log without being able to break the build.
  #
  # Validates the Zig-built bundle. The clap-wrapper-built one is a different
  # artifact from a different entry point, and `clap-wrapper` below covers it.
  clap-validator:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/clap-validator
        with:
          validator-rev: ${{ env.VALIDATOR_REV }}
          rust-version: ${{ env.RUST_VERSION }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version-file: build.zig.zon

      - name: Build the plugin
        run: zig build

      # The bundle's signature, not the linker's. The linker ad-hoc signs the dylib
      # on arm64 whatever anyone does, and that alone leaves the bundle without a
      # Contents/_CodeSignature, which reads as "code has no resources but signature
      # indicates they must be present" rather than as anything obviously absent.
      # `zig build` signs the assembled bundle; this is what catches that step being
      # dropped.
      #
      # Absolute path, matching the build itself: the assertion should exercise the
      # same base-OS tool the signing step used, not whatever PATH resolves to on a
      # future runner image.
      - name: Assert the CLAP is signed
        run: /usr/bin/codesign --verify --strict --verbose zig-out/Fosforo.clap

      # The gate. That a failing test actually reaches a non-zero exit code was
      # confirmed against a deliberately broken build rather than assumed: a
      # duplicated feature entry compiles, passes `zig build test`, and takes
      # this from 16 passed / 0 failed to 15 passed / 1 failed with exit code 1.
      - name: Validate the CLAP
        id: validate
        run: clap-validator validate zig-out/Fosforo.clap

      # Only on the failing path, so the passing path pays nothing for it. The
      # plain output above is already legible in the log; this lifts the failures
      # into the run summary, where they are readable without opening it.
      # Scoped to this step's outcome so a `zig build` failure, which leaves no
      # bundle to validate, does not produce an empty table.
      - name: Summarize the failures
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          clap-validator validate --json --only-failed zig-out/Fosforo.clap > failures.json || true
          {
            echo "### clap-validator, Zig build"
            echo
            echo "| Test | Status | Details |"
            echo "| ---- | ------ | ------- |"
            jq -r '
              .results[]
              | (.test | to_entries[0].value) as $t
              | "| `\($t.test)` | \(.status.code) | \(.status.details // "" | gsub("\n"; " ") | gsub("\\|"; "\\|")) |"
            ' failures.json
          } >> "${GITHUB_STEP_SUMMARY}" || true

  # Everything the clap-wrapper path emits, checked. ADR 0003 makes that path
  # load-bearing: the plugin is authored once as a CLAP and projected outward, and
  # these are the artifacts that prove the projection still works. They share the
  # implementation with the Zig-built bundle but not the entry point, which comes
  # from cmake/entry.cpp here and src/main.zig there, so a defect in that seam or a
  # regression arriving with a clap-wrapper pin bump is invisible above.
  #
  # `--target fosforo_all` rather than naming both targets. It widens automatically
  # if FOSFORO_FORMATS grows, which is wanted: a new format should reach CI by
  # default, not by remembering to edit a target list here. Naming fosforo_auv2 alone
  # does *not* build the CLAP, because setting AUV2_MANUFACTURER_CODE sends
  # make_clapfirst_plugins down its explicit-configuration branch, which never calls
  # add_dependencies() between the two.
  #
  # The AUv2 component is the only artifact carrying a clap-wrapper-generated
  # Info.plist, and two things about it are wrong out of the box: it claims sandbox
  # resources this plugin does not use, and it names the plugin after the ASCII
  # OUTPUT_NAME while describing it as a wrapper. `cmake/narrow-au-resource-usage`
  # and `cmake/set-au-display-name` correct them as POST_BUILD steps, but a rewriting
  # step cannot detect its own absence, so both are asserted independently against a
  # from-scratch build.
  #
  # The slowest job here, because CMake fetches the AudioUnit SDK. That cost is why
  # the CLAP validation lives here rather than in a fourth job that would pay it
  # again. The build and the plist assertions come before the validator install
  # deliberately: on a warm cache the install is nearly free either way, and on a
  # cold one the build result should not wait behind a Rust compile.
  clap-wrapper:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version-file: build.zig.zon

      - name: Build the wrapper artifacts
        run: |
          cmake -B build cmake/
          cmake --build build --target fosforo_all

      - name: Assert the component claims no sandbox resources
        run: |
          ./cmake/narrow-au-resource-usage --check \
            build/assets/Fosforo.component/Contents/Info.plist

      # Also asserts CFBundleExecutable is still ASCII `Fosforo`. The display name
      # and the filename are deliberately different strings, and the failure mode
      # worth catching is them being made the same again in either direction.
      - name: Assert the component carries the display name
        run: |
          ./cmake/set-au-display-name --check \
            build/assets/Fosforo.component/Contents/Info.plist

      # Deliberately after the two assertions above, because the three together are
      # the ordering test and no one of them is it alone. Signing seals
      # Contents/Info.plist, which both of those steps rewrite, so a signing step that
      # ran before the rewrites would pass both of them and fail this one, while a
      # signing step that was dropped fails only this one. The two failures are
      # distinguishable, and neither is visible to a rewriting step inspecting its own
      # work.
      #
      # No --deep: neither bundle contains nested code, because
      # AUV2_MACOSX_EMBEDDED_CLAP_LOCATION is unset and so clap-wrapper's
      # macos_include_clap_in_bundle embeds nothing. --strict covers the rest.
      - name: Assert the wrapper artifacts are signed
        run: |
          /usr/bin/codesign --verify --strict --verbose build/assets/Fosforo.component
          /usr/bin/codesign --verify --strict --verbose build/assets/Fosforo.clap

      - uses: ./.github/actions/clap-validator
        with:
          validator-rev: ${{ env.VALIDATOR_REV }}
          rust-version: ${{ env.RUST_VERSION }}

      # The other half of the gate the `clap-validator` job opened. Phase 0 required
      # both bundles to pass and only one of them was enforced.
      - name: Validate the wrapper-built CLAP
        id: validate
        run: clap-validator validate build/assets/Fosforo.clap

      - name: Summarize the failures
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          clap-validator validate --json --only-failed build/assets/Fosforo.clap > failures.json || true
          {
            echo "### clap-validator, clap-wrapper build"
            echo
            echo "| Test | Status | Details |"
            echo "| ---- | ------ | ------- |"
            jq -r '
              .results[]
              | (.test | to_entries[0].value) as $t
              | "| `\($t.test)` | \(.status.code) | \(.status.details // "" | gsub("\n"; " ") | gsub("\\|"; "\\|")) |"
            ' failures.json
          } >> "${GITHUB_STEP_SUMMARY}" || true
