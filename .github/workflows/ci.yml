name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".claude/**"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".claude/**"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Must run on macOS: the plugin links Cocoa, Metal, QuartzCore and CoreVideo,
  # so it cannot build or test on the default ubuntu-latest runner.
  # Cross-compilation is off for the same reason (see ADR 0001).
  ci:
    uses: cboone/gh-actions/.github/workflows/run-zig-ci.yml@91f9abd25d4f82354c0f950dfc8b6d7525b0f5b5 # v3.0.0
    with:
      zig-version-file: build.zig.zon
      runs-on: macos-latest
      run-cross-compile: false

  # Shaders compile at runtime from embedded source, so the build deliberately
  # does not depend on the Metal toolchain (ADR 0009). This job installs it
  # solely to type-check them, which is why it is separate from `ci` above.
  shaders:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for the Metal toolchain
        id: metal
        run: |
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Metal toolchain absent from this runner image; downloading it."
          fi

      - name: Download the Metal toolchain
        if: steps.metal.outputs.available == 'false'
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun --kill-cache

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version-file: build.zig.zon

      - name: Type-check shaders
        run: zig build validate-shaders

  # The AUv2 component is the only artifact carrying a clap-wrapper-generated
  # Info.plist, and clap-wrapper hardcodes sandbox claims this plugin does not want.
  # `cmake/narrow-au-resource-usage` strips them as a POST_BUILD step, but a
  # stripping step cannot detect its own absence, so this asserts independently
  # against a from-scratch build. It is the slowest job here because CMake fetches
  # the AudioUnit SDK, which is also why it builds only the AUv2 target.
  audio-unit-sandbox:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version-file: build.zig.zon

      - name: Build the Audio Unit
        run: |
          cmake -B build cmake/
          cmake --build build --target fosforo_auv2

      - name: Assert the component claims no sandbox resources
        run: |
          ./cmake/narrow-au-resource-usage --check \
            build/assets/Fosforo.component/Contents/Info.plist
