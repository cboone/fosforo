name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".claude/**"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".claude/**"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Must run on macOS: the plugin links Cocoa, Metal, QuartzCore and CoreVideo,
  # so it cannot build or test on the default ubuntu-latest runner.
  # Cross-compilation is off for the same reason (see ADR 0001).
  ci:
    uses: cboone/gh-actions/.github/workflows/run-zig-ci.yml@91f9abd25d4f82354c0f950dfc8b6d7525b0f5b5 # v3.0.0
    with:
      zig-version-file: build.zig.zon
      runs-on: macos-latest
      run-cross-compile: false

  # Shaders compile at runtime from embedded source, so the build deliberately
  # does not depend on the Metal toolchain (ADR 0009). This job installs it
  # solely to type-check them, which is why it is separate from `ci` above.
  shaders:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for the Metal toolchain
        id: metal
        run: |
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Metal toolchain absent from this runner image; downloading it."
          fi

      - name: Download the Metal toolchain
        if: steps.metal.outputs.available == 'false'
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun --kill-cache

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version-file: build.zig.zon

      - name: Type-check shaders
        run: zig build validate-shaders

  # ADR 0003, AGENTS.md, and the plan's verification table all name
  # `clap-validator` as required verification, but nothing ran it except someone
  # remembering to. The failures it catches are quiet: a descriptor field going
  # null, a lifecycle callback losing `callconv(.c)`, or a duplicate entry in the
  # feature list all compile, pass `zig build test`, and surface only here or
  # inside someone's DAW.
  #
  # Both pins are deliberate. The validator is not on crates.io, so it is built
  # from git, where a commit is the only reference upstream cannot move;
  # `--locked` extends that to its dependency tree. Pinning Rust as well keeps a
  # future stable release that cannot build this commit from turning CI red with
  # no change on this side. Neither pin costs anything on a cache hit.
  #
  # Only failures and crashes fail the job. clap-validator exits non-zero on
  # `num_failed`, which counts `Failed` and `Crashed` but not `Warning`, so a
  # warning appears in the log without being able to break the build.
  #
  # Validates the Zig-built bundle only. The clap-wrapper-built .clap under
  # build/assets/ is not covered; that needs the full CMake build, so it belongs
  # in `audio-unit-sandbox` below, where the SDK fetch is already paid for.
  clap-validator:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      # Tag 0.4.1, resolved to its commit: tags can move, commits cannot.
      VALIDATOR_REV: 152b9823e992d782c5c1fd33bca0295478b919aa
      # clap-validator 0.4.1 declares MSRV 1.95.0 and is edition 2024, which the
      # runner image's preinstalled Rust may or may not satisfy from one refresh
      # to the next. This is the toolchain the local install was built with.
      RUST_VERSION: "1.97.1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Restore and save are split rather than using the combined action so the
      # save is an explicit step on the success path. Installing into a directory
      # this job owns, instead of ~/.cargo/bin, keeps the cached path to exactly
      # what was built here. No restore-keys: a partial match would silently run
      # a validator built from a different commit.
      - name: Restore the cached validator
        id: validator-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/clap-validator
          key: clap-validator-${{ runner.os }}-${{ runner.arch }}-${{ env.VALIDATOR_REV }}-rust${{ env.RUST_VERSION }}

      - name: Build clap-validator
        if: steps.validator-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --no-self-update
          cargo "+${RUST_VERSION}" install \
            --git https://github.com/free-audio/clap-validator \
            --rev "${VALIDATOR_REV}" \
            --locked \
            --root "${RUNNER_TEMP}/clap-validator"

      - name: Cache the built validator
        if: steps.validator-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/clap-validator
          key: ${{ steps.validator-cache.outputs.cache-primary-key }}

      - name: Put the validator on PATH
        run: printf '%s\n' "${RUNNER_TEMP}/clap-validator/bin" >> "${GITHUB_PATH}"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version-file: build.zig.zon

      - name: Build the plugin
        run: zig build

      # The gate. That a failing test actually reaches a non-zero exit code was
      # confirmed against a deliberately broken build rather than assumed: a
      # duplicated feature entry compiles, passes `zig build test`, and takes
      # this from 16 passed / 0 failed to 15 passed / 1 failed with exit code 1.
      - name: Validate the CLAP
        id: validate
        run: clap-validator validate zig-out/Fosforo.clap

      # Only on the failing path, so the passing path pays nothing for it. The
      # plain output above is already legible in the log; this lifts the failures
      # into the run summary, where they are readable without opening it.
      # Scoped to this step's outcome so a `zig build` failure, which leaves no
      # bundle to validate, does not produce an empty table.
      - name: Summarize the failures
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          clap-validator validate --json --only-failed zig-out/Fosforo.clap > failures.json || true
          {
            echo "### clap-validator"
            echo
            echo "| Test | Status | Details |"
            echo "| ---- | ------ | ------- |"
            jq -r '
              .results[]
              | (.test | to_entries[0].value) as $t
              | "| `\($t.test)` | \(.status.code) | \(.status.details // "" | gsub("\n"; " ") | gsub("\\|"; "\\|")) |"
            ' failures.json
          } >> "${GITHUB_STEP_SUMMARY}" || true

  # The AUv2 component is the only artifact carrying a clap-wrapper-generated
  # Info.plist, and clap-wrapper hardcodes sandbox claims this plugin does not want.
  # `cmake/narrow-au-resource-usage` strips them as a POST_BUILD step, but a
  # stripping step cannot detect its own absence, so this asserts independently
  # against a from-scratch build. It is the slowest job here because CMake fetches
  # the AudioUnit SDK, which is also why it builds only the AUv2 target.
  audio-unit-sandbox:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version-file: build.zig.zon

      - name: Build the Audio Unit
        run: |
          cmake -B build cmake/
          cmake --build build --target fosforo_auv2

      - name: Assert the component claims no sandbox resources
        run: |
          ./cmake/narrow-au-resource-usage --check \
            build/assets/Fosforo.component/Contents/Info.plist
