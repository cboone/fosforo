name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Named for the tool rather than `scan`, which trufflehog.yml also used.
  # A reusable workflow's rollup rows are `<caller job>/<inner job>`, so the
  # tool rows were always distinct -- but `scan / Validate inputs` appeared
  # twice, identically, which is the ambiguous branch-protection target
  # markdown.yml records observing on #115. Measured off a real run's job
  # names rather than assumed.
  gitleaks:
    uses: cboone/gh-actions/.github/workflows/scan-for-secrets.yml@91f9abd25d4f82354c0f950dfc8b6d7525b0f5b5 # v3.0.0
    with:
      tool: gitleaks
      # 24s max over 29 runs. An input rather than a job key, because the job
      # belongs to the reusable workflow, whose own default is 15. The
      # `Validate inputs` job there sets no timeout at all and so inherits
      # GitHub's 360; that is not reachable from here.
      timeout-minutes: 3
